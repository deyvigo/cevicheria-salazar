# Local development only; production on the VPS uses a separate compose (adds Traefik and the packaged API)

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: salazar_dev
      POSTGRES_USER: salazar
      POSTGRES_PASSWORD: salazar
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  garage:
    image: dxflrs/garage:v1.0.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
    ports:
      - "3900:3900" # S3 API
      - "3902:3902" # public web endpoint (images)
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_dev_data:/var/lib/garage

volumes:
  postgres_dev_data:
  garage_dev_data:
