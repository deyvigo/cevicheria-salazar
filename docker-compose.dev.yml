# Entorno de desarrollo local (PostgreSQL + Redis + MinIO).
# No confundir con el docker-compose de producción del VPS (docs/diagrama-de-despliegue.md),
# que además incluye Traefik y la API ya empaquetada.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: salazar_dev
      POSTGRES_USER: salazar
      POSTGRES_PASSWORD: salazar
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data

volumes:
  postgres_dev_data:
  minio_dev_data:
