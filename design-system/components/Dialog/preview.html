<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet"></head><body class="cv-stage" style="margin:0">
<div class="cv-row" style="gap:16px">
 <div class="cv-scrim" style="flex:1;min-width:300px">
  <div class="cv-dialog" role="dialog" aria-labelledby="t1">
   <div class="cv-dialog__icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="56" height="56" aria-hidden="true" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="24" fill="#ffc89b"/><path d="M16 20h16l-1.4 14H17.4z" stroke="#9c4208"/><path d="M20 20v-2a4 4 0 018 0v2" stroke="#9c4208"/></svg></div>
   <h2 class="cv-dialog__title" id="t1">¿Confirmar tu pedido?</h2>
   <p class="cv-dialog__text">Total S/ 70.00. Lo prepararemos en unos 15 minutos.</p>
   <div class="cv-dialog__actions"><button class="cv-btn cv-btn--block" >Confirmar pedido</button><button class="cv-btn cv-btn--ghost cv-btn--block" >Seguir pidiendo</button></div>
  </div>
 </div>
 <div class="cv-scrim" style="flex:1;min-width:300px">
  <div class="cv-dialog" role="alertdialog" aria-labelledby="t2">
   <div class="cv-dialog__icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="56" height="56" aria-hidden="true" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="24" fill="#f8bdb7"/><path d="M17 17l14 14M31 17L17 31" stroke="#8f241b"/></svg></div>
   <h2 class="cv-dialog__title" id="t2">No pudimos procesar el pago</h2>
   <p class="cv-dialog__text">Revisa los datos de tu tarjeta e inténtalo de nuevo.</p>
   <div class="cv-dialog__actions"><button class="cv-btn cv-btn--block" >Reintentar pago</button><button class="cv-btn cv-btn--secondary cv-btn--block" >Cambiar método</button></div>
  </div>
 </div>
</div></body></html>
