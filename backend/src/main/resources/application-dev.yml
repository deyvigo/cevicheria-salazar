spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/salazar_dev
    username: ${DB_USERNAME:salazar}
    password: ${DB_PASSWORD:salazar}
  flyway:
    locations: classpath:db/migration,classpath:db/dev
  data:
    redis:
      host: localhost
      port: 6379

app:
  default-admin:
    email: ${APP_DEFAULT_ADMIN_EMAIL:admin@cevicheria-salazar.com}

logging:
  level:
    com.salazar.api: DEBUG
