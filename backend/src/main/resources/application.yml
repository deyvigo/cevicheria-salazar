spring:
  application:
    name: api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  mail:
    # Empty host leaves JavaMailSender unconfigured; the app still boots and sends fail with a logged error
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
            scope: email, profile

server:
  port: 8080

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Redirect target after Google login; distinct from app.cors.allowed-origins even if equal today
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${SMTP_FROM:}
  password-reset:
    token-ttl: 30m
    max-requests: 3
    request-window: 1d
  jwt:
    secret: ${APP_JWT_SECRET:}
    access-token-expiration-minutes: 15
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:platos}
    # Browser-facing base of the bucket (Traefik's media subdomain in production); distinct from the internal endpoint
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  catalog:
    page-size: 20

springdoc:
  swagger-ui:
    path: /swagger-ui.html
