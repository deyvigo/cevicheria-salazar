# Single-node Garage for the VPS; the RPC secret comes from GARAGE_RPC_SECRET
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.internal"

# Buckets are served by exact Host match against a bucket alias (media.<domain>)
[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.internal"
index = "index.html"
